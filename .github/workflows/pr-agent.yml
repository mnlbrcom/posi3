name: pr-agent

# Automatic AI review on every pull request, using the open-source pr-agent
# as a GitHub Action — no Qodo account, no self-hosted server. It runs on
# GitHub's own runner, authenticates to the repo with the workflow's built-in
# GITHUB_TOKEN (so no personal token is needed), and calls Anthropic with the
# ANTHROPIC_API_KEY repo secret. Comment /review, /improve, /ask <q>, /describe
# on a PR to invoke it on demand as well.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# A fresh push supersedes the previous review of the same PR, rather than
# leaving two review runs going at once.
concurrency:
  group: pr-agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  pr_agent:
    # Never react to its own comments, or it would review itself in a loop.
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    name: Review, describe and suggest on each PR
    steps:
      # pr-agent's action never exits non-zero, not even when every LLM call
      # fails — its runner has no exit or raise path at all (checked against
      # servers/github_action_runner.py). It reports failure ONLY as a comment
      # on the PR, so a review that produced nothing still finished green. That
      # happened six times in one afternoon while an API key problem went
      # undiagnosed: the check said "success" every time, and the actual cause
      # was only ever visible by reading the raw run log by hand.
      #
      # These two steps make the comment the job's exit status: note the time
      # before pr-agent runs, then afterwards look for a failure comment posted
      # since then.
      - name: Note the start time
        id: t0
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: pr-agent
        uses: qodo-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # pr-agent reads its Anthropic key from this settings path, not from
          # the bare ANTHROPIC_API_KEY env var — verified against the source.
          ANTHROPIC.KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          config.model: "anthropic/claude-sonnet-5"
          config.fallback_models: '["anthropic/claude-opus-4-8"]'
          # Full auto: all three on every PR, the level chosen for this repo.
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          # Which PR events actually get reviewed. pr-agent's own default omits
          # "synchronize", so a push to an open PR started this job, logged
          # "Skipping action: synchronize", and went green WITHOUT reviewing —
          # a passing pr-agent check that had reviewed nothing. Listing the
          # default four plus synchronize makes a re-push get a fresh review,
          # which is what the trigger list and the concurrency rule above
          # already assumed.
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "review_requested", "synchronize"]'

      - name: Fail if pr-agent reported a failure
        # always(): the point is to report a bad outcome, so it has to run even
        # when the step above went wrong.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # pull_request events carry the number one way, issue_comment the other.
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          SINCE: ${{ steps.t0.outputs.ts }}
        run: |
          # Every pr-agent failure comment opens with "Failed to ..." — "Failed
          # to review PR", "Failed to generate code suggestions for PR". Only
          # comments newer than SINCE count, so an older failure on the same PR
          # can't fail a later run that went fine.
          #
          # ponytail: this detects a failure comment, not the absence of a
          # success one. auto_describe edits the PR description instead of
          # commenting, so "posted nothing" is not by itself wrong. If a failure
          # mode ever turns up that stays completely silent, tighten it then.
          failed=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[ .[]
                    | select(.created_at >= env.SINCE)
                    | select(.user.login | startswith("github-actions"))
                    | select(.body | startswith("Failed to"))
                    | .body | split("\n")[0] ] | .[]')
          if [ -n "$failed" ]; then
            echo "::error::pr-agent produced no review: $failed"
            exit 1
          fi
          echo "No pr-agent failure comment on PR #$PR since $SINCE."
