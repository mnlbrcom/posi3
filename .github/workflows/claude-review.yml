name: claude-review

# Automatic AI review on every pull request, run by Claude Code itself.
#
# It authenticates with a Claude Code OAuth token rather than an Anthropic API
# key, so reviews are billed against the Claude subscription instead of API
# credits. That is the whole reason this replaced pr-agent: pr-agent is
# bring-your-own-key by design and called the API directly, which was a second
# bill on top of the subscription — and it stopped reviewing the moment that
# credit balance hit zero.
#
# The token is generated with `claude setup-token` on a workstation and stored
# as the CLAUDE_CODE_OAUTH_TOKEN repo secret. Without that secret this job
# fails; it is the one piece that cannot live in the repo.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

# A fresh push supersedes the previous review of the same PR, rather than
# leaving two reviews going at once.
concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # Required by claude-code-action: it exchanges a GitHub OIDC token as part of
  # its own auth, and fails with "Could not fetch an OIDC token" without this,
  # regardless of how the Claude credential itself is supplied.
  id-token: write

jobs:
  review:
    # Never react to its own comments, or it would review itself in a loop.
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    name: Review each PR
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Operate as the workflow's own token instead of the Claude Code GitHub
          # App, so the repo needs no app installed. Per the action FAQ: "If you
          # wish to not use the GitHub app, you can instead provide a
          # github_token input for Claude to operate with." Trade-off: review
          # comments appear as github-actions rather than claude[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for posi3, a bridge between POSITAL rotary
            encoders and disguise media servers. If the diff touches src/, read
            CLAUDE.md and the relevant part of docs/FEATURES.md first.

            Priorities, highest first:

            1. Correctness on the data path. The hot path is encoder TCP -> line
               assembly -> parse -> convert -> UDP fanout, and it must stay
               allocation-free per sample: no `new`, template literals or `.map(`
               inside the send loop. The wire format `<devid>:<pos>,<vel>;\n` is a
               hard contract — flag any change to it, a missing trailing `;`
               included.
            2. Real defects only: a concrete failing input or state, and what
               breaks. Not style preference.
            3. Project rules. The disguise API is read-only (never write, never
               poll). Nothing may write to encoder hardware. A change under src/
               needs a docs/FEATURES.md entry. Tests assert facts, not the exact
               phrasing of a message.
            4. Web UI must work in Blink, WebKit and Gecko. No engine-exclusive
               feature without a fallback.

            Skip praise and skip restating what the diff obviously does. If you
            find nothing worth raising, say so in one line.

            Post the review as a single PR comment with `gh pr comment`. Use
            inline comments only for an issue anchored to a specific line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
