name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Both platforms build from macOS: electron-builder 26 stamps the Windows icon
# and version metadata without wine, so one runner produces every artifact and
# the macOS .icns can be assembled by Apple's own iconutil.
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
      - run: npm test

      - name: Build macOS and Windows
        run: |
          npm run dist:mac
          npm run dist:win

      - name: Checksums
        run: |
          cd release
          shasum -a 256 *.dmg *.exe *.zip 2>/dev/null | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: posi3-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/*.exe
            release/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.dmg
            release/*.exe
            release/SHA256SUMS.txt
          body: |
            Builds are **unsigned**. Verify against `SHA256SUMS.txt`.

            - **Windows**: SmartScreen shows "Windows protected your PC" →
              *More info* → *Run anyway*. Also allow posi3 through the Defender
              firewall on **both Private and Public** — a show LAN is usually
              classified as Public and that box is easy to miss.
            - **macOS**: a downloaded copy is quarantined and reports
              "posi3 is damaged", which is misleading. Either System Settings →
              Privacy & Security → *Open Anyway*, or
              `xattr -dr com.apple.quarantine /Applications/posi3.app`.
              Copying over the LAN or a USB stick avoids quarantine entirely.
            - **macOS 15+** prompts for Local Network access on the first
              connection. If declined, every connection fails instantly.
