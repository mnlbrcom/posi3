<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No remote anything. Dynamic styling goes through the CSSOM (el.style.*),
       which CSP permits, so style-src can stay at 'self'.

       connect-src is 'self', not 'none': the UI now reaches its own API over
       fetch and EventSource. When served over HTTP the real policy arrives as a
       response header (see src/server/security.js), which additionally sets
       frame-ancestors — a meta tag cannot express that. This tag remains for
       the file:// case. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>posi3</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="titlebar" class="titlebar">
    <!-- The name is a mashup — POSITAL + d3 — so the wordmark shows the seam:
         "posi" set as a stamped nameplate, the "3" as an inverted die. The
         subtitle uses a crosspoint x rather than an arrow because this is not
         a one-way pipe, it is a junction between two systems. -->
    <span class="wordmark" aria-label="posi3">
      <span class="wordmark-name">posi</span><span class="wordmark-die">3</span>
    </span>
    <span class="titlebar-sub">
      POSITAL&nbsp;IXARC<span class="titlebar-x">&#215;</span>DISGUISE
    </span>
    <!-- Only present below the rail breakpoint. The rail itself becomes the
         panel this opens, so there is one nav to style and one to maintain. -->
    <button class="nav-toggle" id="nav-toggle" type="button"
            aria-label="Menu" aria-expanded="false" aria-controls="sidebar">
      <span class="nav-toggle-bars" aria-hidden="true"></span>
    </button>
  </div>

  <div id="banners" class="banners"></div>

  <div class="shell">
    <nav class="sidebar" id="sidebar">
      <button class="nav-item" data-view="dashboard">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>
        </svg>Dashboard
      </button>
      <button class="nav-item" data-view="connections">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="6" cy="6" r="2.75"/><circle cx="18" cy="18" r="2.75"/><path d="M8 8 L16 16"/>
        </svg>Connections
      </button>
      <button class="nav-item" data-view="encoder">
        <!-- POSITAL mark (input/5 - logos/POSITAL_logo.svg), recoloured to currentColor for the nav. -->
        <svg class="nav-ico" viewBox="0 0 223.69 234.81" fill="currentColor" aria-hidden="true">
          <polygon points="0 0 50.67 13.58 101.35 27.16 64.25 64.25 27.16 101.35 13.58 50.67 0 0"/>
          <polygon points="223.69 0 173.01 13.58 122.34 27.16 159.44 64.25 196.53 101.35 210.11 50.67 223.69 0"/>
          <polygon points="0 234.81 50.67 221.23 101.35 207.65 64.25 170.56 27.16 133.46 13.58 184.14 0 234.81"/>
          <polygon points="223.69 234.81 173.01 221.23 122.34 207.65 159.44 170.56 196.53 133.46 210.11 184.14 223.69 234.81"/>
        </svg>Encoder Config
      </button>
      <button class="nav-item" data-view="mapping">
        <!-- disguise mark (input/5 - logos/DISGUISE_logo.svg), recoloured to currentColor for the nav. -->
        <svg class="nav-ico" viewBox="0 0 16.89 27.43" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M0,27.43V0h.02l3.16,2.27v23.04l-3.18,2.12ZM6.87,22.85l3.17-2.11V6.7l-3.13-2.08-.04,18.23ZM13.76,18.28l3.13-2.18v-4.73l-3.18-2.28.05,9.2Z"/>
        </svg>Disguise Mapping
      </button>
      <button class="nav-item" data-view="log">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6.5 H20"/><path d="M4 11 H20"/><path d="M4 15.5 H15"/><path d="M4 20 H11"/>
        </svg>Log
      </button>
      <button class="nav-item" data-view="settings">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
          <path d="M 22.0 12.0 L 21.24 15.83 L 18.84 14.83 L 17.23 17.23 L 19.07 19.07 L 15.83 21.24 L 14.83 18.84 L 12.0 19.4 L 12.0 22.0 L 8.17 21.24 L 9.17 18.84 L 6.77 17.23 L 4.93 19.07 L 2.76 15.83 L 5.16 14.83 L 4.6 12.0 L 2.0 12.0 L 2.76 8.17 L 5.16 9.17 L 6.77 6.77 L 4.93 4.93 L 8.17 2.76 L 9.17 5.16 L 12.0 4.6 L 12.0 2.0 L 15.83 2.76 L 14.83 5.16 L 17.23 6.77 L 19.07 4.93 L 21.24 8.17 L 18.84 9.17 L 19.4 12.0 Z"/><circle cx="12" cy="12" r="3.1"/>
        </svg>Settings
      </button>
      <div class="sidebar-foot">
        <div class="agg" id="aggregate">—</div>
        <div class="ver" id="version"></div>
      </div>
    </nav>

    <main class="content" id="content"></main>
  </div>

  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
