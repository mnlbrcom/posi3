<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No remote anything. Dynamic styling goes through the CSSOM (el.style.*),
       which CSP permits, so style-src can stay at 'self'.

       connect-src is 'self', not 'none': the UI now reaches its own API over
       fetch and EventSource. When served over HTTP the real policy arrives as a
       response header (see src/server/security.js), which additionally sets
       frame-ancestors — a meta tag cannot express that. This tag remains for
       the file:// case. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>posi3</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="titlebar" class="titlebar">
    <span class="titlebar-name"><span class="d3">posi</span>3</span>
    <span class="titlebar-sub" id="titlebar-sub"></span>
  </div>

  <div id="banners" class="banners"></div>

  <div class="shell">
    <nav class="sidebar" id="sidebar">
      <!-- Text, not an image: the Pixway wordmark PNG was generated by a build
           step and never committed, so it 404'd from a clean checkout. The
           branding is being dropped for a neutral theme regardless. -->
      <div class="brandmark">
        <span class="brandmark-text">posi3</span>
      </div>
      <button class="nav-item" data-view="connections">
        <span class="nav-dot"></span>Connections
      </button>
      <button class="nav-item" data-view="encoder">
        <span class="nav-dot"></span>Encoder config
      </button>
      <button class="nav-item" data-view="mapping">
        <span class="nav-dot"></span>disguise mapping
      </button>
      <button class="nav-item" data-view="log">
        <span class="nav-dot"></span>Log
      </button>
      <button class="nav-item" data-view="settings">
        <span class="nav-dot"></span>Settings
      </button>
      <div class="sidebar-foot">
        <div class="agg" id="aggregate">—</div>
        <div class="ver" id="version"></div>
      </div>
    </nav>

    <main class="content" id="content"></main>
  </div>

  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
